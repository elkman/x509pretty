[package]
name = "x509pretty"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Annotate PEM files: every block stays byte-identical, certificates get a readable comment"
license = "MIT"
authors = ["elkman <elkman@users.noreply.github.com>"]
repository = "https://github.com/elkman/x509pretty"
readme = "README.md"
keywords = ["x509", "pem", "certificate", "tls", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
sha2 = "0.10"
time = "0.3"
x509-parser = "0.18"

[dev-dependencies]
assert_cmd = "2.2"
